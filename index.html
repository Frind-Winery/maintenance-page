<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frind Estate Winery &mdash; Back Soon</title>
<style>
  :root {
    --primary-color: #1a1a1a;
    --secondary-color: #857650;
    --accent-color: #a08b60;
    --light-color: #f8f8f8;
    --gold-light: #b8a67a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: var(--light-color);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--primary-color);
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 220px;
    max-width: 70%;
    height: auto;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.03em;
    margin: 0 0 16px;
    color: var(--secondary-color);
  }
  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #555;
    margin: 0 0 8px;
  }
  .rule {
    width: 60px;
    height: 2px;
    background: var(--gold-light);
    margin: 24px auto;
    border: none;
  }
  .footnote {
    font-size: 0.85rem;
    color: #999;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Frind Estate Winery">
    <h1>We'll be back shortly</h1>
    <p>Our website is temporarily offline for scheduled maintenance.</p>
    <hr class="rule">
    <p>Thank you for your patience &mdash; please check back soon.</p>
    <p class="footnote">Frind Estate Winery</p>
  </div>
</body>
</html>
